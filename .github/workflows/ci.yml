name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  proxy:
    name: Proxy tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm test

  tui:
    name: TUI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache-dependency-path: tui/go.sum
      - run: go test -count=1 ./...
      - run: go build -o cc-flux .
